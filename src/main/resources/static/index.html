<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Auth Test</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        input, button { margin: 0.5rem 0; padding: 0.5rem; width: 100%; box-sizing: border-box; }
        pre { background: #f4f4f4; padding: 1rem; border-radius: 4px; overflow-x: auto; }
        .section { margin: 1.5rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
<h1>🔐 JWT Auth Test</h1>

<div class="section">
    <h3>📝 Регистрация</h3>
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPass" placeholder="Password">
    <input type="text" id="regUsername" placeholder="Username">
    <button onclick="register()">Зарегистрировать</button>
</div>

<div class="section">
    <h3>🔑 Вход</h3>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="login()">Войти</button>
</div>

<div class="section">
    <h3>👤 Проверка доступа</h3>
    <button onclick="getUser()">Получить данные пользователя</button>
    <button onclick="refresh()">Обновить токен</button>
    <button onclick="logout()">Выйти</button>
</div>

<h3>📋 Результат:</h3>
<pre id="result">Нажми кнопку для теста...</pre>

<script>
    const API = ''; // пустая строка = тот же домен (localhost:8080)

    function show(data) {
        document.getElementById('result').innerText =
            typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
    }

    async function register() {
        const res = await fetch(`${API}/auth/registration`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'include',
            body: JSON.stringify({
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPass').value,
                username: document.getElementById('regUsername').value
            })
        });
        show(await res.text());
    }

    async function login() {
        const res = await fetch(`${API}/auth/sign-in`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'include',
            body: JSON.stringify({
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPass').value
            })
        });
        show(await res.text());
    }

    async function getUser() {
        const email = document.getElementById('loginEmail').value;
        const res = await fetch(`${API}/user/by-email/${email}`, {
            method: 'GET',
            credentials: 'include'
        });
        show(await res.json());
    }

    async function refresh() {
        const res = await fetch(`${API}/auth/refresh`, {
            method: 'POST',
            credentials: 'include'
        });
        show(await res.json());
    }

    async function logout() {
        const res = await fetch(`${API}/auth/logout`, {
            method: 'POST',
            credentials: 'include'
        });
        show(await res.text());
    }
</script>
</body>
</html>
